name: Build Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv git unzip openjdk-17-jdk

      - name: Create python venv and install buildozer
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip buildozer

      - name: Build APK with buildozer
        run: |
          source venv/bin/activate
          buildozer android debug
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 加班工资计算器-APK
          path: bin/*.apk
