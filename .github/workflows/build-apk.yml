name: Build Kivy APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv openjdk-11-jdk unzip wget git

      - name: Install buildozer
        run: |
          pip3 install buildozer

      - name: Build APK
        run: |
          buildozer android debug deploy run || true
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          yes | ./sdkmanager --licenses
          cd $GITHUB_WORKSPACE
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 加班工资计算器APK
          path: bin/*.apk
