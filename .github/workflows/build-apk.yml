name: Build Kivy APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv openjdk-11-jdk unzip wget git

      - name: Install buildozer
        run: |
          pip3 install buildozer

      - name: Download Android SDK cmdline tools
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      - name: Accept all Android SDK licenses
        run: |
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          yes | ./sdkmanager --licenses
          yes | ./sdkmanager "platforms;android-32" "build-tools;32.0.0" "ndk;25.2.9519653"

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 加班工资计算器APK
          path: bin/*.apk
