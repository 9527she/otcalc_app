name: Build Kivy APK
# 允许手动点击按钮触发编译，不用提交代码才编译
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: 配置Python虚拟环境，安装buildozer
        run: |
          python3 -m venv ~/venv
          source ~/venv/bin/activate
          pip install --upgrade pip wheel cython buildozer

      - name: 执行buildozer编译debug-apk
        run: |
          source ~/venv/bin/activate
          buildozer android clean
          buildozer -v android debug

      - name: 上传编译好的APK作为下载产物
        uses: actions/upload-artifact@v4
        with:
          name: 加班工资计算器-APK
          path: bin/*.apk
