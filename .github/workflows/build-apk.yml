name: Buildozer APK Build
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击触发打包

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool pkg-config

      - name: Install buildozer + pinned python-for-android
        run: |
          python -m pip install --upgrade pip
          # 锁定python-for-android版本，规避新版SDK路径bug
          pip install buildozer python-for-android==2024.04.29

      - name: Buildozer init if buildozer.spec missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

      - name: Build APK
        run: |
          buildozer android debug deploy run || true
          # 修复 sdkmanager 路径问题：buildozer 去 tools/bin 找，新版SDK在 cmdline-tools/latest/bin
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "${SDK_ROOT}/tools"
          ln -s "${SDK_ROOT}/cmdline-tools/latest/bin" "${SDK_ROOT}/tools/bin"
          # 重新执行打包
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
